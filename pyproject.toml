[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytaudio"
version = "0.1.0"
description = "Minimal CLI to download YouTube audio, convert to MP3, and transcribe locally."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ytaudio contributors"}]
dependencies = [
    "typer[all]>=0.12,<0.13",
    "click>=8.1,<8.2",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/example/ytaudio"

[project.scripts]
ytaudio = "ytaudio.cli:app"

[tool.typer]
autocomplete = false
